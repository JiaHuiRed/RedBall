<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline' 'self'; script-src 'self'">
  <title>RedBall</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div id="app">
    <div class="bar-row">
      <div class="metric">
        <span class="label">CPU</span>
        <div class="bar-track"><div class="bar-fill" id="cpu-fill"></div></div>
        <span class="val" id="cpu-val">0%</span>
      </div>
      <div class="metric gpu">
        <span class="label">GPU</span>
        <div class="bar-track"><div class="bar-fill" id="gpu-fill"></div></div>
        <span class="val" id="gpu-val">--</span>
      </div>
      <div class="metric">
        <span class="label">显存</span>
        <div class="bar-track"><div class="bar-fill" id="vram-fill"></div></div>
        <span class="val" id="vram-val">--</span>
      </div>
      <div class="metric net">
        <span class="net-dn">↓<span id="net-rx">0</span></span>
        <span class="net-up">↑<span id="net-tx">0</span></span>
      </div>
    </div>
    <div class="bar-row">
      <div class="metric">
        <span class="label">GPU</span>
        <span class="val temp" id="gpu-temp">--°C</span>
      </div>
      <div class="metric">
        <span class="label">内存</span>
        <div class="bar-track"><div class="bar-fill" id="mem-fill"></div></div>
        <span class="val" id="mem-val">0%</span>
      </div>
    </div>
  </div>

  <div id="menu" class="menu hidden">
    <div class="menu-item" id="menu-pin">置顶</div>
    <div class="menu-item" id="menu-close">关闭</div>
  </div>

  <script type="module" src="./app.ts"></script>
</body>
</html>
